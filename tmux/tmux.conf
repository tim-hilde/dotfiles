unbind r
bind r source ~/dotfiles/tmux/tmux.conf

bind l send-keys C-l

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 30%,30% \
    --no-sort --ansi \
    --border-label ' Sessions ' \
    --border-label-pos=3 \
    --info=hidden \
    --reverse \
    --cycle \
    --no-scrollbar \
    --color='bg:#1e1e2e,bg+:#313244,fg:#cdd6f4,fg+:#cdd6f4,pointer:#cba6f7,border-label:#cba6f7,border:#cba6f7,separator:#6D7085,prompt:#89b4fa' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' \
)\""

# open new window and start opencode
bind-key O new-window -c "#{pane_current_path}" \; send-keys "opencode" Enter

# pick an opencode agent (waiting -> done -> working) and jump to it
bind-key a run-shell -b "~/.config/tmux/agent-switch.sh"

set -g prefix C-s

set -g mouse on
set -g extended-keys on

set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set-option -g set-titles on
set -g set-titles-string "#S"

# go to last window
bind-key l last-window

# change windows shift left or right
bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

# kill windows and panes without confirmation
bind-key & kill-window
bind-key x kill-pane

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "catppuccin/tmux"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'theolundqvist/aw-watcher-tmux'
set -g @plugin 'Morantron/tmux-fingers'

# Resurrect
set -g @resurrect-processes 'lazygit'

# Fingers
set -g @fingers-keyboard-layout "qwertz-homerow"
set -g @fingers-pattern-0 'opencode -s ses_[a-zA-Z0-9]+'
bind o run -b "#{@fingers-cli} start #{pane_id} --patterns 0 --main-action 'xargs -I{} tmux send-keys -t #{pane_id} {} Enter'"

# yanking/selecting
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# enter copy-mode via leader + #
bind-key \# copy-mode

# Configure Catppuccin
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S #[bg=default]},#{#[fg=#{@thm_green}]  #S }}"
set -ga status-left "#[fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[fg=#{@thm_blue}]  #{=/-20/...:#{s|/Users/$USER|~|:#{pane_current_path}}} "

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right '#(~/.config/tmux/agent-fleet.sh)'
set -ga status-right '#(~/.config/tmux/github-notifier.sh)'
set -ga status-right '#[fg=#{@thm_red}]#(cd #{pane_current_path}; [ -d .git ] || git rev-parse --git-dir >/dev/null 2>&1 && echo " $(git rev-parse --abbrev-ref HEAD) ")'
set -ga status-right "#[fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-right "#[fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Configure Tmux
set -g status-position top
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@thm_overlay_0}"
setw -g pane-border-style "fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
# set -wg automatic-rename on
# set -g automatic-rename-format "Window"

set -g window-status-format " #I: #{=/10/...:window_name} "
set -g window-status-style "fg=#{@thm_rosewater}"
set -g window-status-last-style "fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I: #{=/10/...:window_name} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.config/tmux/tmux.remote.conf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/dotfiles/tmux/plugins/tpm/tpm"
